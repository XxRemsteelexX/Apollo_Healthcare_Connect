name: Baseline CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lightweight-gates:
    name: Lightweight OSS gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff bandit detect-secrets

      - name: Python syntax compile
        run: |
          python -m py_compile app.py app_production.py symptom_classifier.py medical_classifier_training.py

      - name: Static contract tests
        run: |
          python -m pytest tests/test_static_contracts.py -q

      - name: Ruff lint advisory
        continue-on-error: true
        run: |
          ruff check .

      - name: Bandit security advisory
        continue-on-error: true
        run: |
          bandit -q -r . -x ./.venv,./notebooks,./tests

      - name: Secret scan
        run: |
          detect-secrets scan --all-files --exclude-files '^notebooks/|^\.git/|^\.pytest_cache/|^\.ruff_cache/'
